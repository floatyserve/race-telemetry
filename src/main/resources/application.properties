spring.application.name=telemetry
spring.threads.virtual.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:172.23.14.199}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:mq}
spring.rabbitmq.password=${RABBITMQ_PASS:mq}
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=20
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Consumer Retries with Exponential Backoff
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
# When retries are exhausted, reject without requeue (sends to DLX)
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:172.23.14.199}:${POSTGRES_PORT:5432}/race_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server & OpenAPI
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html